apiVersion: v1
kind: Secret
metadata:
  name: finflow-secrets
  namespace: finflow
type: Opaque
stringData:
  DB_USER: "finflow"
  DB_PASSWORD: "finflow_secret"
  JWT_ACCESS_SECRET: "finflow_access_secret_change_in_production"
  JWT_REFRESH_SECRET: "finflow_refresh_secret_change_in_production"
  GROQ_API_KEY: "your_groq_api_key_here"
  GOOGLE_CLIENT_ID: "placeholder"
  GOOGLE_CLIENT_SECRET: "placeholder"
  GITHUB_CLIENT_ID: "placeholder"
  GITHUB_CLIENT_SECRET: "placeholder"
