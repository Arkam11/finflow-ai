apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: finflow
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: finflow/auth-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3001
          envFrom:
            - configMapRef:
                name: finflow-common-config
            - secretRef:
                name: finflow-secrets
          env:
            - name: PORT
              value: "3001"
          livenessProbe:
            httpGet:
              path: /auth/health
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /auth/health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "300m"
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: finflow
spec:
  selector:
    app: auth-service
  ports:
    - port: 3001
      targetPort: 3001
