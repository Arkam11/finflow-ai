apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: finflow
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      containers:
        - name: ai-service
          image: finflow/ai-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3004
          envFrom:
            - configMapRef:
                name: finflow-common-config
            - secretRef:
                name: finflow-secrets
          env:
            - name: PORT
              value: '3004'
          livenessProbe:
            httpGet:
              path: /health
              port: 3004
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 3004
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              memory: '256Mi'
              cpu: '200m'
            limits:
              memory: '512Mi'
              cpu: '600m'
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: finflow
spec:
  selector:
    app: ai-service
  ports:
    - port: 3004
      targetPort: 3004
