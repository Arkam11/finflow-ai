apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: finflow
  labels:
    app: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: finflow/gateway:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: finflow-common-config
            - secretRef:
                name: finflow-secrets
          env:
            - name: PORT
              value: '3000'
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: '128Mi'
              cpu: '100m'
            limits:
              memory: '256Mi'
              cpu: '300m'
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: finflow
spec:
  selector:
    app: gateway
  ports:
    - port: 3000
      targetPort: 3000
  type: NodePort
