apiVersion: apps/v1
kind: Deployment
metadata:
  name: transaction-service
  namespace: finflow
spec:
  replicas: 2
  selector:
    matchLabels:
      app: transaction-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: transaction-service
    spec:
      containers:
        - name: transaction-service
          image: finflow/transaction-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3003
          envFrom:
            - configMapRef:
                name: finflow-common-config
            - secretRef:
                name: finflow-secrets
          env:
            - name: PORT
              value: '3003'
            - name: KAFKA_CLIENT_ID
              value: 'transaction-service'
            - name: KAFKA_GROUP_ID
              value: 'transaction-group'
          livenessProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 40
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 15
            periodSeconds: 5
          resources:
            requests:
              memory: '256Mi'
              cpu: '200m'
            limits:
              memory: '512Mi'
              cpu: '500m'
---
apiVersion: v1
kind: Service
metadata:
  name: transaction-service
  namespace: finflow
spec:
  selector:
    app: transaction-service
  ports:
    - port: 3003
      targetPort: 3003
