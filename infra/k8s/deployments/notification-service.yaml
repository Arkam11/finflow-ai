apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: finflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: finflow/notification-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3006
          envFrom:
            - configMapRef:
                name: finflow-common-config
            - secretRef:
                name: finflow-secrets
          env:
            - name: PORT
              value: "3006"
            - name: KAFKA_CLIENT_ID
              value: "notification-service"
            - name: KAFKA_GROUP_ID
              value: "notification-group"
          livenessProbe:
            httpGet:
              path: /health
              port: 3006
            initialDelaySeconds: 40
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 3006
            initialDelaySeconds: 15
            periodSeconds: 5
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: finflow
spec:
  selector:
    app: notification-service
  ports:
    - port: 3006
      targetPort: 3006
